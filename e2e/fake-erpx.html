<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><title>Fake ERPx</title></head>
<body>
  <h1>Onkostennota (fake ERPx for tests)</h1>
  <button data-u4id="addExpenseLine" type="button">Kosten toevoegen</button>
  <button data-u4id="deleteExpenseLine" type="button">Kosten verwijderen</button>
  <button data-u4id="delete" type="button">Verwijderen</button>
  <script>
    // A minimal stand-in for the parts of ERPx (ExtJS) that the fill bookmark uses.
    const records = [{ data: { expenseDate: new Date(2026, 10, 3), expenseType: 'FIETSVG', quantity: 18 } }];
    let editing = null;
    let selected = [];
    let confirming = false;
    // Like ExtJS, each() hands out the same record objects every time.
    const withGet = r => { r.get = r.get || (k => r.data[k]); return r; };
    const store = { each(fn) { records.slice().forEach(r => fn(withGet(r))); } };
    const grid = {
      getStore: () => store,
      getSelectionModel: () => ({ select(r) { selected = [r]; }, getSelection: () => selected }),
      editingPlugin: {
        editing: false,
        completeEdit() {
          const line = editing;
          if (!line) return;
          setTimeout(() => { records.push(line); editing = null; grid.editingPlugin.editing = false; }, window.fake.delay);
        },
      },
    };
    // The confirmation ERPx asks after "Kosten verwijderen".
    const yesButton = { itemId: 'yes', text: 'Ja', isVisible: () => confirming, el: { dom: { click() {
      if (!confirming) return;
      confirming = false;
      for (const r of selected) { const i = records.indexOf(r); if (i >= 0) records.splice(i, 1); }
      selected = [];
    } } } };
    const open = () => editing && editing.open;
    const combo = {
      name: 'expenseType',
      isVisible: () => open(),
      getValue: () => editing?.data.expenseType,
      getStore: () => ({ findRecord: (field, value) => (value === 'FIETSVG' ? { value } : null) }),
      select(record) { editing.data.expenseType = record.value; },
    };
    const datefield = { name: 'expenseDate', isVisible: () => open(), getValue: () => editing?.data.expenseDate, setValue(d) {
      if (window.fake.failOnDay === d.getDate()) throw new Error('ERPx hiccup');
      editing.data.expenseDate = d;
    } };
    const numberfield = { name: 'quantity', isVisible: () => open(), getValue: () => editing?.data.quantity, setValue(n) { editing.data.quantity = n; }, triggerBlur() {} };
    const purpose = { u4Id: 'travelPurpose', value: '', setValue(v) { this.value = v; } };
    window.Ext = { ComponentQuery: { query(sel) {
      if (sel === 'grid' && window.fake.noGrid) return [];
      return ({ grid: [grid], combobox: [combo], datefield: [datefield], numberfield: [numberfield], textfield: [purpose], button: [yesButton] })[sel] || [];
    } } };
    document.querySelector('[data-u4id="addExpenseLine"]').addEventListener('click', () => {
      const line = { data: {}, open: false };
      editing = line;
      grid.editingPlugin.editing = true;
      setTimeout(() => { line.open = true; }, window.fake.delay);
    });
    document.querySelector('[data-u4id="deleteExpenseLine"]').addEventListener('click', () => {
      if (selected.length && !window.fake.noConfirm) confirming = true;
    });
    // Deletes the whole claim. The panel must never press it.
    document.querySelector('[data-u4id="delete"]').addEventListener('click', () => { records.length = 0; window.fake.claimDeleted = true; });
    window.fake = { records, purpose, failOnDay: null, noGrid: false, noConfirm: false, claimDeleted: false, delay: 80 };
  </script>
</body>
</html>
