<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><title>Fake ERPx</title></head>
<body>
  <h1>Onkostennota (fake ERPx for tests)</h1>
  <button data-u4id="addExpenseLine" type="button">Kosten toevoegen</button>
  <script>
    // A minimal stand-in for the parts of ERPx (ExtJS) that the fill bookmark uses.
    const records = [{ data: { expenseDate: new Date(2026, 10, 3), expenseType: 'FIETSVG', quantity: 18 } }];
    let editing = null;
    const store = { each(fn) { records.forEach(r => fn({ get: k => r.data[k] })); } };
    const grid = { getStore: () => store, editingPlugin: { completeEdit() { if (editing) { records.push(editing); editing = null; } } } };
    const combo = {
      name: 'expenseType',
      getStore: () => ({ findRecord: (field, value) => (value === 'FIETSVG' ? { value } : null) }),
      select(record) { editing.data.expenseType = record.value; },
    };
    const datefield = { name: 'expenseDate', setValue(d) { editing.data.expenseDate = d; } };
    const numberfield = { name: 'quantity', setValue(n) { editing.data.quantity = n; }, triggerBlur() {} };
    const purpose = { u4Id: 'travelPurpose', value: '', setValue(v) { this.value = v; } };
    window.Ext = { ComponentQuery: { query(sel) {
      return ({ grid: [grid], combobox: [combo], datefield: [datefield], numberfield: [numberfield], textfield: [purpose] })[sel] || [];
    } } };
    document.querySelector('[data-u4id="addExpenseLine"]').addEventListener('click', () => { editing = { data: {} }; });
    window.fake = { records, purpose };
  </script>
</body>
</html>
